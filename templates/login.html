{% extends "base.html" %}
{% block title %}BOXCLOUD - Login{% endblock %}
{% block styles %}
<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }
    .login-container {
        background: white;
        padding: 48px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 440px;
    }
    .logo-section {
        text-align: center;
        margin-bottom: 32px;
    }
    .logo {
        font-size: 48px;
        margin-bottom: 16px;
    }
    .app-name {
        font-size: 32px;
        font-weight: 700;
        color: #667eea;
        margin-bottom: 8px;
    }
    .subtitle {
        color: #605e5c;
        font-size: 14px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #323130;
        font-size: 14px;
        font-weight: 500;
    }
    .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #edebe9;
        border-radius: 6px;
        font-size: 15px;
        transition: all 0.3s;
    }
    .form-group input:focus {
        outline: none;
        border-color: #667eea;
    }
    .password-input-wrapper {
        position: relative;
    }
    .password-input-wrapper input {
        padding-right: 45px;
    }
    .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 18px;
        padding: 4px 8px;
        color: #605e5c;
        transition: color 0.2s;
    }
    .password-toggle:hover {
        color: #667eea;
    }
    .btn-login {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 8px;
    }
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    .message {
        margin-top: 16px;
        padding: 12px;
        border-radius: 6px;
        font-size: 14px;
        text-align: center;
        display: none;
    }
    .message.error {
        background: #fde7e9;
        color: #d13438;
        border: 1px solid #f1aeb5;
    }
    .message.show {
        display: block;
    }
    .register-link {
        text-align: center;
        margin-top: 24px;
    }
    .register-link a {
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
    }
    .register-link a:hover {
        text-decoration: underline;
    }
    .admin-link {
        text-align: center;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #edebe9;
    }
    .admin-link a {
        color: #605e5c;
        text-decoration: none;
        font-size: 13px;
    }
    .admin-link a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
{% block content %}
<div class="login-container">
    <div class="logo-section">
        <div class="logo">📦</div>
        <div class="app-name">BOXCLOUD</div>
        <div class="subtitle">Your Secure Cloud Storage</div>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input-wrapper">
                <input type="password" id="password" name="password" placeholder="Enter your password" required />
                <button type="button" class="password-toggle" onclick="togglePasswordVisibility()" id="passwordToggle">👁️</button>
            </div>
        </div>

        <div class="forgot-password-link">
            <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="message" id="message"></div>

    <div class="register-link">
        <a href="{{ url_for('register') }}">Don't have an account? Register here</a>
    </div>

    <div class="admin-link">
        <a href="{{ url_for('admin_login') }}">🔐 Login as Admin</a>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('passwordToggle');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleButton.textContent = '🙈';
        } else {
            passwordInput.type = 'password';
            toggleButton.textContent = '👁️';
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const message = document.getElementById('message');
        
        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();
            
            if (data.success) {
                if (data.requires_otp) {
                    // Show success message before redirecting to OTP page
                    message.textContent = data.message || 'OTP sent to your email';
                    message.className = 'message success show';
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1500);
                } else {
                    window.location.href = data.redirect;
                }
            } else {
                message.textContent = data.message || 'Invalid credentials';
                message.className = 'message error show';
            }
        } catch (error) {
            message.textContent = 'Connection error. Please try again.';
            message.className = 'message error show';
        }
    });
</script>
{% endblock %}
