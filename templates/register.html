{% extends "base.html" %}
{% block title %}BOXCLOUD - Register{% endblock %}
{% block styles %}
<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }
    .register-container {
        background: white;
        padding: 48px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 440px;
    }
    .logo-section {
        text-align: center;
        margin-bottom: 32px;
    }
    .logo {
        font-size: 48px;
        margin-bottom: 16px;
    }
    .app-name {
        font-size: 32px;
        font-weight: 700;
        color: #667eea;
        margin-bottom: 8px;
    }
    .subtitle {
        color: #605e5c;
        font-size: 14px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #323130;
        font-size: 14px;
        font-weight: 500;
    }
    .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #edebe9;
        border-radius: 6px;
        font-size: 15px;
        transition: all 0.3s;
    }
    .form-group input:focus {
        outline: none;
        border-color: #667eea;
    }
    .password-input-wrapper {
        position: relative;
    }
    .password-input-wrapper input {
        padding-right: 45px;
    }
    .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 18px;
        padding: 4px 8px;
        color: #605e5c;
        transition: color 0.2s;
    }
    .password-toggle:hover {
        color: #667eea;
    }
    .btn-register {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 8px;
    }
    .btn-register:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    .message {
        margin-top: 16px;
        padding: 12px;
        border-radius: 6px;
        font-size: 14px;
        text-align: center;
        display: none;
    }
    .message.error {
        background: #fde7e9;
        color: #d13438;
        border: 1px solid #f1aeb5;
    }
    .message.success {
        background: #e8f5e9;
        color: #2e7d32;
        border: 1px solid #a5d6a7;
    }
    .message.show {
        display: block;
    }
    .login-link {
        text-align: center;
        margin-top: 24px;
    }
    .login-link a {
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
    }
    .login-link a:hover {
        text-decoration: underline;
    }
    .free-space {
        background: #e8f5e9;
        border: 1px solid #a5d6a7;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 24px;
        text-align: center;
        font-size: 14px;
        color: #2e7d32;
    }
</style>
{% endblock %}
{% block content %}
<div class="register-container">
    <div class="logo-section">
        <div class="logo">📦</div>
        <div class="app-name">BOXCLOUD</div>
        <div class="subtitle">Create Your Account</div>
    </div>

    <div class="free-space">
        🎉 Get 5GB of free storage when you sign up!
    </div>

    <form id="registerForm">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input-wrapper">
                <input type="password" id="password" name="password" placeholder="Create a password" required />
                <button type="button" class="password-toggle" onclick="togglePasswordVisibility()" id="passwordToggle">👁️</button>
            </div>
        </div>

        <button type="submit" class="btn-register">Create Account</button>
    </form>

    <div class="message" id="message"></div>

    <div class="login-link">
        <a href="{{ url_for('login') }}">Already have an account? Sign in</a>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('passwordToggle');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleButton.textContent = '🙈';
        } else {
            passwordInput.type = 'password';
            toggleButton.textContent = '👁️';
        }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const message = document.getElementById('message');
        
        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            
            const data = await response.json();
            
            if (data.success) {
                // Show success message before redirecting
                message.textContent = data.message || 'Account created successfully! Redirecting to login...';
                message.className = 'message show';
                message.style.background = '#e8f5e9';
                message.style.color = '#2e7d32';
                message.style.border = '1px solid #a5d6a7';
                setTimeout(() => {
                    window.location.href = data.redirect;
                }, 1500);
            } else {
                message.textContent = data.message || 'Registration failed';
                message.className = 'message error show';
            }
        } catch (error) {
            message.textContent = 'Connection error. Please try again.';
            message.className = 'message error show';
        }
    });
</script>
{% endblock %}
